name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: createfactoryplanner-jar
          path: neoforge/build/libs/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
          if-no-files-found: ignore

  boundaries:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: core must not import net.minecraft
        run: |
          dir=planner-core/src/main/java/fr/syuko/createfactoryplanner/core
          [ -d "$dir" ] || exit 0
          ! grep -rl "net\.minecraft" "$dir"

      - name: gui and app must not import com.simibubi
        run: |
          dirs=""
          for d in gui app; do
            [ -d "neoforge/src/main/java/fr/syuko/createfactoryplanner/$d" ] && dirs="$dirs neoforge/src/main/java/fr/syuko/createfactoryplanner/$d"
          done
          [ -n "$dirs" ] || exit 0
          ! grep -rl "com\.simibubi" $dirs

      - name: com.simibubi only inside data
        run: |
          ! grep -rl "com\.simibubi" --include="*.java" neoforge/src/main/java/fr/syuko/createfactoryplanner/ \
            | grep -v "/data/"
